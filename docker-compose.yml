services:
  # Serviço da aplicação Django
  lillia:
    build: .
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      - dolphin 

  dolphin:
    image: mysql:8.0
    container_name: dolphin_vblog
    restart: always
    environment:
      MYSQL_DATABASE: django_db
      MYSQL_USER: django_user
      MYSQL_PASSWORD: django_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  apollo:
    image: phpmyadmin/phpmyadmin
    container_name: apollo_vblog
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: dolphin
      PMA_USER: root
      PMA_PASSWORD: root_pass
    depends_on:
      - dolphin

  # Serviço do Servidor Web Nginx (Proxy Reverso)
  libra:
    image: nginx:stable-alpine
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro  # ADICIONE :ro AQUI TAMBÉM
    ports:
      - "80:80"
    depends_on:
      - lillia

# Volumes persistentes para ficheiros estáticos e uploads
volumes:
  static_volume:
  media_volume:
  mysql_data: 