# Define o grupo de servidores para o qual as requisições serão enviadas
upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    # Configuração para arquivos estáticos (CSS, JS, Imagens)
    location /static/ {
        alias /app/static/;
    }

    # Configuração para arquivos de mídia (Uploads de usuários)
    location /media/ {
        alias /app/media/;
    }

    # Proxy reverso para o Gunicorn/Django
    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}