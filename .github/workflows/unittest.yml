name: Run Unit Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_pass
          MYSQL_ROOT_PASSWORD: root_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_pass
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

      DJANGO_SETTINGS_MODULE: project.settings
      SECRET_KEY: "test-secret-key-for-ci"
      GEMINI_API_KEY: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install MySQL Client
        run: sudo apt-get install -y mysql-client

      - name: Wait for MySQL to be ready
        run: |
          until mysqladmin ping -h"$DB_HOST" --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Create test database and grant permissions
        run: |
          mysql -h "$DB_HOST" -u root -proot_pass -e "CREATE DATABASE IF NOT EXISTS test_test_db;"
          mysql -h "$DB_HOST" -u root -proot_pass -e "GRANT ALL PRIVILEGES ON test_test_db.* TO 'test_user'@'%';"
          mysql -h "$DB_HOST" -u root -proot_pass -e "FLUSH PRIVILEGES;"

      - name: Run Migrations
        run: python manage.py migrate

      - name: Run Tests
        run: python manage.py test blog
